name: CI-compile

on:
  push:
  pull_request:

jobs:
  udpfs-ack-host-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check cumulative ACK order and sequence wrap
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic iop/udpfs/tests/test_ack_sequence.c -o /tmp/test_udpfs_ack
          /tmp/test_udpfs_ack

  build:
    runs-on: ubuntu-latest
    container: ps2max/dev:v20260228
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make clean all release

      - name: Upload release as artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          path: |
            releases/*.7z

      - name: Create latest release
        if: github.ref == 'refs/heads/master'
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "latest"
          title: "Latest development build"
          files: |
            releases/*.7z
